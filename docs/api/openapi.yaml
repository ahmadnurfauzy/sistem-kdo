openapi: 3.0.3
info:
  title: 'Sistem KDO API Documentation'
  description: 'REST API Sistem Pengelolaan Kendaraan Dinas Operasional (KDO) Perangkat Daerah — JP-1 (20270311).'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Autentikasi
    description: ''
  -
    name: 'Kendaraan (KDO)'
    description: ''
  -
    name: Laporan
    description: ''
  -
    name: 'Pegawai (PNS)'
    description: ''
  -
    name: 'Perangkat Daerah (PD)'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Login pengguna'
      operationId: loginPengguna
      description: "Login dengan email dan password untuk mendapatkan bearer token. Token\ndipakai pada seluruh endpoint lain melalui header `Authorization: Bearer {token}`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login berhasil.'
                  data:
                    token: 1|abc...
                    user:
                      id: 1
                      name: 'Administrator KDO'
                      email: admin@kdo.test
                      role: admin
                properties:
                  message:
                    type: string
                    example: 'Login berhasil.'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|abc...
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Administrator KDO'
                          email:
                            type: string
                            example: admin@kdo.test
                          role:
                            type: string
                            example: admin
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Email atau password salah.'
                  errors:
                    email:
                      - 'Email atau password salah.'
                properties:
                  message:
                    type: string
                    example: 'Email atau password salah.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'Email atau password salah.'
                        items:
                          type: string
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email pengguna.'
                  example: admin@kdo.test
                password:
                  type: string
                  description: 'Password pengguna (min. 8 karakter).'
                  example: password123
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Logout pengguna'
      operationId: logoutPengguna
      description: 'Mencabut token yang sedang dipakai. Token tidak dapat digunakan lagi setelah logout.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logout berhasil.'
                properties:
                  message:
                    type: string
                    example: 'Logout berhasil.'
      tags:
        - Autentikasi
  /api/v1/auth/me:
    get:
      summary: 'Profil pengguna aktif'
      operationId: profilPenggunaAktif
      description: 'Mengembalikan profil pemilik token yang sedang dipakai.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Administrator KDO'
                    email: admin@kdo.test
                    role: admin
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Administrator KDO'
                      email:
                        type: string
                        example: admin@kdo.test
                      role:
                        type: string
                        example: admin
      tags:
        - Autentikasi
  /api/v1/kendaraan:
    get:
      summary: 'Daftar kendaraan (KDO)'
      operationId: daftarKendaraanKDO
      description: "Daftar kendaraan dinas operasional dengan pencarian (nomor polisi/merek/tipe),\nfilter kondisi, filter perangkat daerah, dan paginasi."
      parameters:
        -
          in: query
          name: search
          description: 'Opsional, cari nomor polisi/merek/tipe.'
          example: avanza
          required: false
          schema:
            type: string
            description: 'Opsional, cari nomor polisi/merek/tipe.'
            example: avanza
        -
          in: query
          name: kondisi
          description: 'Opsional, salah satu: baik, rusak_ringan, rusak_berat.'
          example: rusak_berat
          required: false
          schema:
            type: string
            description: 'Opsional, salah satu: baik, rusak_ringan, rusak_berat.'
            example: rusak_berat
        -
          in: query
          name: perangkat_daerah_id
          description: 'Opsional, filter ID perangkat daerah.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Opsional, filter ID perangkat daerah.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Opsional, jumlah item per halaman (maks 100).'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Opsional, jumlah item per halaman (maks 100).'
            example: 15
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data: []
                  links:
                    first: 'http://localhost:8000/api/v1/kendaraan?page=1'
                    last: 'http://localhost:8000/api/v1/kendaraan?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: null
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: 'http://localhost:8000/api/v1/kendaraan?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: 'http://localhost:8000/api/v1/kendaraan'
                    per_page: 15
                    to: null
                    total: 0
                properties:
                  data:
                    type: array
                    example: []
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost:8000/api/v1/kendaraan?page=1'
                      last:
                        type: string
                        example: 'http://localhost:8000/api/v1/kendaraan?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: string
                        example: null
                        nullable: true
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          -
                            url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          -
                            url: 'http://localhost:8000/api/v1/kendaraan?page=1'
                            label: '1'
                            page: 1
                            active: true
                          -
                            url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                              nullable: true
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: 'http://localhost:8000/api/v1/kendaraan'
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: string
                        example: null
                        nullable: true
                      total:
                        type: integer
                        example: 0
      tags:
        - 'Kendaraan (KDO)'
    post:
      summary: 'Tambah kendaraan (KDO)'
      operationId: tambahKendaraanKDO
      description: "Membuat data kendaraan dinas baru. Hanya admin. Penanggung jawab (opsional)\nharus pegawai dari perangkat daerah yang sama."
      parameters: []
      responses:
        201:
          description: sukses
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 16
                    nomor_polisi: 'DK 7777 ZZ'
                    kondisi: baik
                    kondisi_label: Baik
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 16
                      nomor_polisi:
                        type: string
                        example: 'DK 7777 ZZ'
                      kondisi:
                        type: string
                        example: baik
                      kondisi_label:
                        type: string
                        example: Baik
        422:
          description: 'PJ beda PD'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: '...'
                  errors:
                    pegawai_id:
                      - 'Penanggung jawab harus pegawai dari perangkat daerah yang sama.'
                properties:
                  message:
                    type: string
                    example: '...'
                  errors:
                    type: object
                    properties:
                      pegawai_id:
                        type: array
                        example:
                          - 'Penanggung jawab harus pegawai dari perangkat daerah yang sama.'
                        items:
                          type: string
      tags:
        - 'Kendaraan (KDO)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nomor_polisi:
                  type: string
                  description: 'Nomor polisi unik (contoh: DK 1234 AB).'
                  example: 'DK 7777 ZZ'
                merek:
                  type: string
                  description: 'Merek kendaraan.'
                  example: Honda
                tipe:
                  type: string
                  description: 'Tipe/model kendaraan.'
                  example: 'Brio Satya E'
                tahun_produksi:
                  type: integer
                  description: 'Tahun produksi (1980-kini).'
                  example: 2023
                warna:
                  type: string
                  description: 'Warna kendaraan.'
                  example: Biru
                kondisi:
                  type: string
                  description: 'Kondisi: baik, rusak_ringan, atau rusak_berat.'
                  example: baik
                perangkat_daerah_id:
                  type: integer
                  description: 'ID perangkat daerah pemilik.'
                  example: 2
                pegawai_id:
                  type: integer
                  description: 'Opsional, ID pegawai penanggung jawab (satu PD).'
                  example: 4
                  nullable: true
              required:
                - nomor_polisi
                - merek
                - tipe
                - tahun_produksi
                - warna
                - kondisi
                - perangkat_daerah_id
  '/api/v1/kendaraan/{id}':
    get:
      summary: 'Detail kendaraan (KDO)'
      operationId: detailKendaraanKDO
      description: "Mengambil satu data kendaraan berdasarkan ID, termasuk perangkat daerah\npemilik dan penanggung jawab."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    nomor_polisi: 'DK 1234 AB'
                    merek: Toyota
                    tipe: 'Avanza 1.5 G'
                    tahun_produksi: 2021
                    warna: Putih
                    kondisi: baik
                    kondisi_label: Baik
                    perangkat_daerah:
                      id: 1
                      kode: SETDA
                      nama: 'Sekretariat Daerah'
                    penanggung_jawab:
                      id: 1
                      nama: 'Budi Santoso'
                      nip: '197504121998031001'
                      jabatan: 'Kepala Bagian Umum'
                      golongan: IV/b
                    dibuat_pada: '2026-11-10 05:25:13'
                    diubah_pada: '2026-11-10 05:25:13'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      nomor_polisi:
                        type: string
                        example: 'DK 1234 AB'
                      merek:
                        type: string
                        example: Toyota
                      tipe:
                        type: string
                        example: 'Avanza 1.5 G'
                      tahun_produksi:
                        type: integer
                        example: 2021
                      warna:
                        type: string
                        example: Putih
                      kondisi:
                        type: string
                        example: baik
                      kondisi_label:
                        type: string
                        example: Baik
                      perangkat_daerah:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          kode:
                            type: string
                            example: SETDA
                          nama:
                            type: string
                            example: 'Sekretariat Daerah'
                      penanggung_jawab:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          nama:
                            type: string
                            example: 'Budi Santoso'
                          nip:
                            type: string
                            example: '197504121998031001'
                          jabatan:
                            type: string
                            example: 'Kepala Bagian Umum'
                          golongan:
                            type: string
                            example: IV/b
                      dibuat_pada:
                        type: string
                        example: '2026-11-10 05:25:13'
                      diubah_pada:
                        type: string
                        example: '2026-11-10 05:25:13'
      tags:
        - 'Kendaraan (KDO)'
    parameters:
      -
        in: path
        name: id
        description: 'ID kendaraan.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/kendaraan/{kendaraan_id}':
    put:
      summary: 'Ubah kendaraan (KDO)'
      operationId: ubahKendaraanKDO
      description: 'Memperbarui data kendaraan. Hanya admin.'
      parameters: []
      responses: {}
      tags:
        - 'Kendaraan (KDO)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nomor_polisi:
                  type: string
                  description: 'Must match the regex /^[A-Za-z]{1,2}\s?\d{1,4}\s?[A-Za-z]{0,3}$/. Must not be greater than 15 characters.'
                  example: b
                merek:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                tipe:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: g
                tahun_produksi:
                  type: integer
                  description: 'Must be between 1980 and 2027.'
                  example: 1981
                warna:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: m
                kondisi:
                  type: string
                  description: ''
                  example: rusak_ringan
                  enum:
                    - baik
                    - rusak_ringan
                    - rusak_berat
                perangkat_daerah_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                pegawai_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
              required:
                - nomor_polisi
                - merek
                - tipe
                - tahun_produksi
                - warna
                - kondisi
                - perangkat_daerah_id
    patch:
      summary: 'Ubah kendaraan (KDO)'
      operationId: ubahKendaraanKDO
      description: 'Memperbarui data kendaraan. Hanya admin.'
      parameters: []
      responses: {}
      tags:
        - 'Kendaraan (KDO)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nomor_polisi:
                  type: string
                  description: 'Must match the regex /^[A-Za-z]{1,2}\s?\d{1,4}\s?[A-Za-z]{0,3}$/. Must not be greater than 15 characters.'
                  example: b
                merek:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                tipe:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: g
                tahun_produksi:
                  type: integer
                  description: 'Must be between 1980 and 2027.'
                  example: 1981
                warna:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: m
                kondisi:
                  type: string
                  description: ''
                  example: baik
                  enum:
                    - baik
                    - rusak_ringan
                    - rusak_berat
                perangkat_daerah_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                pegawai_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
              required:
                - nomor_polisi
                - merek
                - tipe
                - tahun_produksi
                - warna
                - kondisi
                - perangkat_daerah_id
    delete:
      summary: 'Hapus kendaraan (KDO)'
      operationId: hapusKendaraanKDO
      description: 'Menghapus data kendaraan. Hanya admin.'
      parameters: []
      responses:
        204:
          description: sukses
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - 'Kendaraan (KDO)'
    parameters:
      -
        in: path
        name: kendaraan_id
        description: 'The ID of the kendaraan.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: id
        description: 'ID kendaraan.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/kendaraan/{kendaraan_id}/penanggung-jawab':
    put:
      summary: 'Tetapkan penanggung jawab kendaraan'
      operationId: tetapkanPenanggungJawabKendaraan
      description: "Menetapkan, mengganti, atau melepas pegawai penanggung jawab sebuah kendaraan.\nHanya admin. Pegawai harus berasal dari perangkat daerah pemilik kendaraan."
      parameters: []
      responses:
        200:
          description: sukses
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    nomor_polisi: 'DK 5678 CD'
                    penanggung_jawab:
                      id: 2
                      nama: 'Siti Rahmawati'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      nomor_polisi:
                        type: string
                        example: 'DK 5678 CD'
                      penanggung_jawab:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                          nama:
                            type: string
                            example: 'Siti Rahmawati'
        422:
          description: 'PJ beda PD'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: '...'
                  errors:
                    pegawai_id:
                      - 'Penanggung jawab harus pegawai dari perangkat daerah yang sama.'
                properties:
                  message:
                    type: string
                    example: '...'
                  errors:
                    type: object
                    properties:
                      pegawai_id:
                        type: array
                        example:
                          - 'Penanggung jawab harus pegawai dari perangkat daerah yang sama.'
                        items:
                          type: string
      tags:
        - 'Kendaraan (KDO)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pegawai_id:
                  type: integer
                  description: 'Opsional, ID pegawai penanggung jawab; null untuk melepas penugasan.'
                  example: 2
                  nullable: true
    parameters:
      -
        in: path
        name: kendaraan_id
        description: 'The ID of the kendaraan.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: id
        description: 'ID kendaraan.'
        example: 2
        required: true
        schema:
          type: integer
  /api/v1/laporan/kondisi:
    get:
      summary: 'Rekap kondisi kendaraan per perangkat daerah'
      operationId: rekapKondisiKendaraanPerPerangkatDaerah
      description: "Laporan jumlah kendaraan tiap perangkat daerah menurut kondisi\n(baik, rusak ringan, rusak berat) beserta ringkasan total keseluruhan."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      perangkat_daerah:
                        id: 1
                        kode: SETDA
                        nama: 'Sekretariat Daerah'
                      total_kendaraan: 2
                      kondisi:
                        baik: 1
                        rusak_ringan: 1
                        rusak_berat: 0
                      tanpa_penanggung_jawab: 0
                  ringkasan:
                    total_perangkat_daerah: 6
                    total_kendaraan: 15
                    total_baik: 9
                    total_rusak_ringan: 4
                    total_rusak_berat: 2
                properties:
                  data:
                    type: array
                    example:
                      -
                        perangkat_daerah:
                          id: 1
                          kode: SETDA
                          nama: 'Sekretariat Daerah'
                        total_kendaraan: 2
                        kondisi:
                          baik: 1
                          rusak_ringan: 1
                          rusak_berat: 0
                        tanpa_penanggung_jawab: 0
                    items:
                      type: object
                      properties:
                        perangkat_daerah:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            kode:
                              type: string
                              example: SETDA
                            nama:
                              type: string
                              example: 'Sekretariat Daerah'
                        total_kendaraan:
                          type: integer
                          example: 2
                        kondisi:
                          type: object
                          properties:
                            baik:
                              type: integer
                              example: 1
                            rusak_ringan:
                              type: integer
                              example: 1
                            rusak_berat:
                              type: integer
                              example: 0
                        tanpa_penanggung_jawab:
                          type: integer
                          example: 0
                  ringkasan:
                    type: object
                    properties:
                      total_perangkat_daerah:
                        type: integer
                        example: 6
                      total_kendaraan:
                        type: integer
                        example: 15
                      total_baik:
                        type: integer
                        example: 9
                      total_rusak_ringan:
                        type: integer
                        example: 4
                      total_rusak_berat:
                        type: integer
                        example: 2
      tags:
        - Laporan
  /api/v1/pegawai:
    get:
      summary: 'Daftar pegawai (PNS)'
      operationId: daftarPegawaiPNS
      description: 'Daftar pegawai negeri sipil dengan pencarian, filter perangkat daerah, dan paginasi.'
      parameters:
        -
          in: query
          name: search
          description: 'Opsional, cari berdasarkan nama/NIP/jabatan.'
          example: budi
          required: false
          schema:
            type: string
            description: 'Opsional, cari berdasarkan nama/NIP/jabatan.'
            example: budi
        -
          in: query
          name: perangkat_daerah_id
          description: 'Opsional, filter ID perangkat daerah.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Opsional, filter ID perangkat daerah.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Opsional, jumlah item per halaman (maks 100).'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Opsional, jumlah item per halaman (maks 100).'
            example: 15
      responses:
        200:
