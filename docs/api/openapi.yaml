openapi: 3.0.3
info:
  title: 'Sistem KDO API Documentation'
  description: 'REST API Sistem Pengelolaan Kendaraan Dinas Operasional (KDO) Perangkat Daerah — JP-1 (20270311).'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Akun (Kelola Pengguna)'
    description: ''
  -
    name: Autentikasi
    description: ''
  -
    name: 'Kendaraan (KDO)'
    description: ''
  -
    name: Laporan
    description: ''
  -
    name: 'Pegawai (PNS)'
    description: ''
  -
    name: 'Perangkat Daerah (PD)'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/akun:
    get:
      summary: 'Daftar akun pengguna'
      operationId: daftarAkunPengguna
      description: 'Daftar akun sistem dengan pencarian (nama/email), filter role, dan paginasi. Hanya admin.'
      parameters:
        -
          in: query
          name: search
          description: 'Opsional, cari berdasarkan nama atau email.'
          example: pengelola
          required: false
          schema:
            type: string
            description: 'Opsional, cari berdasarkan nama atau email.'
            example: pengelola
        -
          in: query
          name: role
          description: 'Opsional, filter role: admin, pengelola, pengguna.'
          example: pengelola
          required: false
          schema:
            type: string
            description: 'Opsional, filter role: admin, pengelola, pengguna.'
            example: pengelola
        -
          in: query
          name: per_page
          description: 'Opsional, jumlah item per halaman (maks 100).'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Opsional, jumlah item per halaman (maks 100).'
            example: 15
      responses:
        200:
          description: sukses
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Administrator KDO'
                      email: admin@kdo.test
                      role: admin
                      dibuat_pada: '2026-11-10 06:00:00'
                      diubah_pada: '2026-11-10 06:00:00'
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    per_page: 15
                    to: 3
                    total: 3
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Administrator KDO'
                        email: admin@kdo.test
                        role: admin
                        dibuat_pada: '2026-11-10 06:00:00'
                        diubah_pada: '2026-11-10 06:00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Administrator KDO'
                        email:
                          type: string
                          example: admin@kdo.test
                        role:
                          type: string
                          example: admin
                        dibuat_pada:
                          type: string
                          example: '2026-11-10 06:00:00'
                        diubah_pada:
                          type: string
                          example: '2026-11-10 06:00:00'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        example: 3
                      total:
                        type: integer
                        example: 3
      tags:
        - 'Akun (Kelola Pengguna)'
    post:
      summary: 'Tambah akun pengguna'
      operationId: tambahAkunPengguna
      description: 'Membuat akun baru dengan role admin, pengelola, atau pengguna. Hanya admin.'
      parameters: []
      responses:
        201:
          description: sukses
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 4
                    name: 'Budi Pengelola'
                    email: budi@kdo.test
                    role: pengelola
                    dibuat_pada: '2026-11-10 06:10:00'
                    diubah_pada: '2026-11-10 06:10:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      name:
                        type: string
                        example: 'Budi Pengelola'
                      email:
                        type: string
                        example: budi@kdo.test
                      role:
                        type: string
                        example: pengelola
                      dibuat_pada:
                        type: string
                        example: '2026-11-10 06:10:00'
                      diubah_pada:
                        type: string
                        example: '2026-11-10 06:10:00'
        403:
          description: 'bukan admin'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Akses ditolak. Hanya admin yang boleh mengelola akun.'
                properties:
                  message:
                    type: string
                    example: 'Akses ditolak. Hanya admin yang boleh mengelola akun.'
        422:
          description: 'email duplikat'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Email sudah terdaftar.'
                  errors:
                    email:
                      - 'Email sudah terdaftar.'
                properties:
                  message:
                    type: string
                    example: 'Email sudah terdaftar.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'Email sudah terdaftar.'
                        items:
                          type: string
      tags:
        - 'Akun (Kelola Pengguna)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nama pengguna.'
                  example: 'Budi Pengelola'
                email:
                  type: string
                  description: 'Email unik.'
                  example: budi@kdo.test
                password:
                  type: string
                  description: 'Kata sandi (min. 8 karakter).'
                  example: password123
                role:
                  type: string
                  description: 'Role: admin, pengelola, atau pengguna.'
                  example: pengelola
              required:
                - name
                - email
                - password
                - role
  '/api/v1/akun/{id}':
    get:
      summary: 'Detail akun pengguna'
      operationId: detailAkunPengguna
      description: 'Mengambil satu data akun berdasarkan ID. Hanya admin.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Administrator KDO'
                    email: admin@kdo.test
                    role: admin
                    dibuat_pada: '2026-11-10 06:00:00'
                    diubah_pada: '2026-11-10 06:00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Administrator KDO'
                      email:
                        type: string
                        example: admin@kdo.test
                      role:
                        type: string
                        example: admin
                      dibuat_pada:
                        type: string
                        example: '2026-11-10 06:00:00'
                      diubah_pada:
                        type: string
                        example: '2026-11-10 06:00:00'
        404:
          description: 'tidak ditemukan'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Data tidak ditemukan.'
                properties:
                  message:
                    type: string
                    example: 'Data tidak ditemukan.'
      tags:
        - 'Akun (Kelola Pengguna)'
    put:
      summary: 'Ubah akun pengguna'
      operationId: ubahAkunPengguna
      description: "Memperbarui nama, email, role, dan/atau kata sandi akun. Kata sandi\nopsional — kosongkan bila tidak ingin mengubah. Role admin terakhir\ntidak dapat diturunkan (409). Hanya admin."
      parameters: []
      responses:
        200:
          description: sukses
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    name: 'Pengelola KDO'
                    email: pengelola@kdo.test
                    role: pengelola
                    dibuat_pada: '2026-11-10 06:00:00'
                    diubah_pada: '2026-11-10 06:15:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Pengelola KDO'
                      email:
                        type: string
                        example: pengelola@kdo.test
                      role:
                        type: string
                        example: pengelola
                      dibuat_pada:
                        type: string
                        example: '2026-11-10 06:00:00'
                      diubah_pada:
                        type: string
                        example: '2026-11-10 06:15:00'
        409:
          description: 'admin terakhir diturunkan'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Tidak dapat menurunkan role admin terakhir. Tambahkan admin lain terlebih dahulu.'
                properties:
                  message:
                    type: string
                    example: 'Tidak dapat menurunkan role admin terakhir. Tambahkan admin lain terlebih dahulu.'
      tags:
        - 'Akun (Kelola Pengguna)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nama pengguna.'
                  example: 'Pengelola KDO'
                email:
                  type: string
                  description: 'Email unik.'
                  example: pengelola@kdo.test
                password:
                  type: string
                  description: 'Opsional, kata sandi baru (min. 8 karakter). Kosongkan bila tidak diubah.'
                  example: passwordBaru
                  nullable: true
                role:
                  type: string
                  description: 'Role: admin, pengelola, atau pengguna.'
                  example: pengelola
              required:
                - name
                - email
                - role
    delete:
      summary: 'Hapus akun pengguna'
      operationId: hapusAkunPengguna
      description: "Menghapus akun beserta token aktifnya. Tidak dapat menghapus akun\nyang sedang dipakai (409) atau admin terakhir (409). Hanya admin."
      parameters: []
      responses:
        204:
          description: sukses
          content:
            text/plain:
              schema:
                type: string
                example: ''
        409:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'akun sendiri'
                    type: object
                    example:
                      message: 'Tidak dapat menghapus akun yang sedang Anda gunakan.'
                    properties:
                      message:
                        type: string
                        example: 'Tidak dapat menghapus akun yang sedang Anda gunakan.'
                  -
                    description: 'admin terakhir'
                    type: object
                    example:
                      message: 'Tidak dapat menghapus admin terakhir.'
                    properties:
                      message:
                        type: string
                        example: 'Tidak dapat menghapus admin terakhir.'
      tags:
        - 'Akun (Kelola Pengguna)'
    parameters:
      -
        in: path
        name: id
        description: 'ID akun.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/akun/{akun_id}':
    patch:
      summary: 'Ubah akun pengguna'
      operationId: ubahAkunPengguna
      description: "Memperbarui nama, email, role, dan/atau kata sandi akun. Kata sandi\nopsional — kosongkan bila tidak ingin mengubah. Role admin terakhir\ntidak dapat diturunkan (409). Hanya admin."
      parameters: []
      responses:
        200:
          description: sukses
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    name: 'Pengelola KDO'
                    email: pengelola@kdo.test
                    role: pengelola
                    dibuat_pada: '2026-11-10 06:00:00'
                    diubah_pada: '2026-11-10 06:15:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Pengelola KDO'
                      email:
                        type: string
                        example: pengelola@kdo.test
                      role:
                        type: string
                        example: pengelola
                      dibuat_pada:
                        type: string
                        example: '2026-11-10 06:00:00'
                      diubah_pada:
                        type: string
                        example: '2026-11-10 06:15:00'
        409:
          description: 'admin terakhir diturunkan'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Tidak dapat menurunkan role admin terakhir. Tambahkan admin lain terlebih dahulu.'
                properties:
                  message:
                    type: string
                    example: 'Tidak dapat menurunkan role admin terakhir. Tambahkan admin lain terlebih dahulu.'
      tags:
        - 'Akun (Kelola Pengguna)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nama pengguna.'
                  example: 'Pengelola KDO'
                email:
                  type: string
                  description: 'Email unik.'
                  example: pengelola@kdo.test
                password:
                  type: string
                  description: 'Opsional, kata sandi baru (min. 8 karakter). Kosongkan bila tidak diubah.'
                  example: passwordBaru
                  nullable: true
                role:
                  type: string
                  description: 'Role: admin, pengelola, atau pengguna.'
                  example: pengelola
              required:
                - name
                - email
                - role
    parameters:
      -
        in: path
        name: akun_id
        description: 'The ID of the akun.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: id
        description: 'ID akun.'
        example: 2
        required: true
        schema:
          type: integer
  /api/v1/auth/login:
    post:
      summary: 'Login pengguna'
      operationId: loginPengguna
      description: "Login dengan email dan password untuk mendapatkan bearer token. Token\ndipakai pada seluruh endpoint lain melalui header `Authorization: Bearer {token}`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login berhasil.'
                  data:
                    token: 1|abc...
                    user:
                      id: 1
                      name: 'Administrator KDO'
                      email: admin@kdo.test
                      role: admin
                properties:
                  message:
                    type: string
                    example: 'Login berhasil.'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|abc...
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Administrator KDO'
                          email:
                            type: string
                            example: admin@kdo.test
                          role:
                            type: string
                            example: admin
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Email atau password salah.'
                  errors:
                    email:
                      - 'Email atau password salah.'
                properties:
                  message:
                    type: string
                    example: 'Email atau password salah.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'Email atau password salah.'
                        items:
                          type: string
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email pengguna.'
                  example: admin@kdo.test
                password:
                  type: string
                  description: 'Password pengguna (min. 8 karakter).'
                  example: password123
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Logout pengguna'
      operationId: logoutPengguna
      description: 'Mencabut token yang sedang dipakai. Token tidak dapat digunakan lagi setelah logout.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logout berhasil.'
                properties:
                  message:
                    type: string
                    example: 'Logout berhasil.'
      tags:
        - Autentikasi
  /api/v1/auth/me:
    get:
      summary: 'Profil pengguna aktif'
      operationId: profilPenggunaAktif
      description: 'Mengembalikan profil pemilik token yang sedang dipakai.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Administrator KDO'
                    email: admin@kdo.test
                    role: admin
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Administrator KDO'
                      email:
                        type: string
                        example: admin@kdo.test
                      role:
                        type: string
                        example: admin
      tags:
        - Autentikasi
  /api/v1/kendaraan:
    get:
      summary: 'Daftar kendaraan (KDO)'
      operationId: daftarKendaraanKDO
      description: "Daftar kendaraan dinas operasional dengan pencarian (nomor polisi/merek/tipe),\nfilter kondisi, filter perangkat daerah, dan paginasi."
      parameters:
        -
          in: query
          name: search
          description: 'Opsional, cari nomor polisi/merek/tipe.'
          example: avanza
          required: false
          schema:
            type: string
            description: 'Opsional, cari nomor polisi/merek/tipe.'
            example: avanza
        -
          in: query
          name: kondisi
          description: 'Opsional, salah satu: baik, rusak_ringan, rusak_berat.'
          example: rusak_berat
          required: false
          schema:
            type: string
            description: 'Opsional, salah satu: baik, rusak_ringan, rusak_berat.'
            example: rusak_berat
        -
          in: query
          name: perangkat_daerah_id
          description: 'Opsional, filter ID perangkat daerah.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Opsional, filter ID perangkat daerah.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Opsional, jumlah item per halaman (maks 100).'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Opsional, jumlah item per halaman (maks 100).'
            example: 15
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Tidak terautentikasi. Sertakan token yang valid.'
                properties:
                  message:
                    type: string
                    example: 'Tidak terautentikasi. Sertakan token yang valid.'
      tags:
        - 'Kendaraan (KDO)'
    post:
      summary: 'Tambah kendaraan (KDO)'
      operationId: tambahKendaraanKDO
      description: "Membuat data kendaraan dinas baru. Hanya admin. Penanggung jawab (opsional)\nharus pegawai dari perangkat daerah yang sama."
      parameters: []
      responses:
        201:
          description: sukses
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 16
                    nomor_polisi: 'DK 7777 ZZ'
                    kondisi: baik
                    kondisi_label: Baik
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 16
                      nomor_polisi:
                        type: string
                        example: 'DK 7777 ZZ'
                      kondisi:
                        type: string
                        example: baik
                      kondisi_label:
                        type: string
                        example: Baik
        422:
          description: 'PJ beda PD'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: '...'
                  errors:
                    pegawai_id:
                      - 'Penanggung jawab harus pegawai dari perangkat daerah yang sama.'
                properties:
                  message:
                    type: string
                    example: '...'
                  errors:
                    type: object
                    properties:
                      pegawai_id:
                        type: array
                        example:
                          - 'Penanggung jawab harus pegawai dari perangkat daerah yang sama.'
                        items:
                          type: string
      tags:
        - 'Kendaraan (KDO)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nomor_polisi:
                  type: string
                  description: 'Nomor polisi unik (contoh: DK 1234 AB).'
                  example: 'DK 7777 ZZ'
                merek:
                  type: string
                  description: 'Merek kendaraan.'
                  example: Honda
                tipe:
                  type: string
                  description: 'Tipe/model kendaraan.'
                  example: 'Brio Satya E'
                tahun_produksi:
                  type: integer
                  description: 'Tahun produksi (1980-kini).'
                  example: 2023
                warna:
                  type: string
                  description: 'Warna kendaraan.'
                  example: Biru
                kondisi:
                  type: string
                  description: 'Kondisi: baik, rusak_ringan, atau rusak_berat.'
                  example: baik
                perangkat_daerah_id:
                  type: integer
                  description: 'ID perangkat daerah pemilik.'
                  example: 2
                pegawai_id:
                  type: integer
                  description: 'Opsional, ID pegawai penanggung jawab (satu PD).'
                  example: 4
                  nullable: true
              required:
                - nomor_polisi
                - merek
                - tipe
                - tahun_produksi
                - warna
                - kondisi
                - perangkat_daerah_id
  '/api/v1/kendaraan/{id}':
    get:
      summary: 'Detail kendaraan (KDO)'
      operationId: detailKendaraanKDO
      description: "Mengambil satu data kendaraan berdasarkan ID, termasuk perangkat daerah\npemilik dan penanggung jawab."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Tidak terautentikasi. Sertakan token yang valid.'
                properties:
                  message:
                    type: string
                    example: 'Tidak terautentikasi. Sertakan token yang valid.'
      tags:
        - 'Kendaraan (KDO)'
    parameters:
      -
        in: path
        name: id
        description: 'ID kendaraan.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/kendaraan/{kendaraan_id}':
    put:
      summary: 'Ubah kendaraan (KDO)'
      operationId: ubahKendaraanKDO
      description: 'Memperbarui data kendaraan. Hanya admin.'
      parameters: []
      responses: {}
      tags:
        - 'Kendaraan (KDO)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nomor_polisi:
                  type: string
                  description: 'Must match the regex /^[A-Za-z]{1,2}\s?\d{1,4}\s?[A-Za-z]{0,3}$/. Must not be greater than 15 characters.'
                  example: b
                merek:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                tipe:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: g
                tahun_produksi:
                  type: integer
                  description: 'Must be between 1980 and 2027.'
                  example: 1981
                warna:
                  type: string
